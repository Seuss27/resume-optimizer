# way-of-working plugin contract for this repo (plugin v0.30.0 schema).
# Full key reference: reference/project-schema.md in glunk-works/claude-workbench at the pinned tag.
# Every value below was read from this repo on 2026-11-05, and `repo` and the ruleset blocks
# again on 2026-11-06 after the transfer to glunk-works. Both mirror a live read-back of
# `GET /repos/glunk-works/resume-orchestrator/rules/branches/main`. The check names are the names
# GitHub reports for the required checks.

# ── identity ─────────────────────────────────────────────────────────────────
repo: glunk-works/resume-orchestrator
pr_base: main
migration_base: null   # no long-lived integration branch; every PR lands on main.

# ── the deep record ──────────────────────────────────────────────────────────
roadmap: docs/proposals/pipeline-plan.md   # the plan: design, phases, sprints. GitHub holds status.
sprints_dir: sprints                       # declared but unused: planning.kind is github_milestones.
threat_model: docs/proposals/pipeline-plan.md   # §3.7 trust boundaries, §3.8 writes and credentials, §5 risks.

planning:
  kind: github_milestones   # one sprint = one milestone (S01–S10). Its issues are the task list.

decisions:
  log: docs/decisions.md
  prefix: RO-D

backlog:
  kind: github_issues
  repo: null              # this repo. It is PUBLIC: no issue may carry personal data (CLAUDE.md rule 4).
  path: null
  item_prefix: null

load_bearing_docs:
  - CLAUDE.md
  - readme.md
  - docs/decisions.md
  - docs/proposals/pipeline-plan.md
  - .ai/next-steps.md

# ── what counts as a behavior change ─────────────────────────────────────────
code_paths:
  - src/
  - tests/
  - .claude/
  - .github/
  - .ai/project.yml
  - pyproject.toml
  - uv.lock
  - .python-version
  - .gitignore              # the main guard against personal data being committed
  - .pre-commit-config.yaml
  - betterleaks.toml        # absent on purpose: the org scan reads it, and the ignore file below, from the
  - .betterleaksignore      # PR's base commit, so a change that silences it needs a critic's look
  - .gitattributes          # likewise absent: it can hide files from a scan
  - tune_template.py        # stays until D5 removes it

# ── the local green gate ─────────────────────────────────────────────────────
# A local pre-check; CI on the PR is the gate of record.
gates:
  green:
    - { run: uv run pytest }
    - { run: uv run ruff check . }
    - { run: uv run ruff format --check . }

# ── branch protection ────────────────────────────────────────────────────────
# `main-required-checks` (ruleset id 26540407), `enforcement: active`, no bypass actors (read from
# `GET /repos/glunk-works/resume-orchestrator/rulesets/26540407`), targeting the default branch.
# Any new required check goes to GitHub first and is mirrored here second.
ruleset:
  name: main-required-checks
  rule_types: [deletion, non_fast_forward, pull_request, required_status_checks]
  required_checks:
    - lint
    - test
    - dependency-audit
    - sbom
    - zizmor
    - pr-title
    - secrets / scan
  check_integrations: {"secrets / scan": 15368}
rulesets:
  - name: main-required-checks
    source: repo
    rule_types: [deletion, non_fast_forward, pull_request, required_status_checks]
    required_checks:
      - lint
      - test
      - dependency-audit
      - sbom
      - zizmor
      - pr-title
      - secrets / scan
    check_integrations: {"secrets / scan": 15368}

# ── the fresh-session review gate ────────────────────────────────────────────
review:
  ci_gate: null   # no review CI gate yet (identities: null). /way-of-working:critic-gate is the
                  # standing critic look, and the maintainer's merge is the remaining gate.

# ── agents ───────────────────────────────────────────────────────────────────
agents:
  enabled: [architect, coder, security-critic, docs-consistency]
  # Rule-selected, no pick-list: architect and security-critic for code_paths and for the extra
  # prefixes below (tracked paths that can carry rule-4 content, and the agent instructions);
  # docs-consistency for .md files and load_bearing_docs. The cursor ledger .ai/next-steps.md is
  # left out on purpose and gets docs-consistency only (CLAUDE.md, critic table). A new tracked
  # path under .ai/ must be added below, or it gets no architect or security-critic. Interim until
  # the review CI gate (#88).
  diff_rule: [docs/, .ai/parked/, .ai/context/, CLAUDE.md, CHANGELOG.md, readme.md, example_, dummy_gemini_output.json]
models:
  architect: opus
  coder: sonnet
  second_opinion: null   # no different-model round offered by default.

# ── the sprint-orchestrator loop ─────────────────────────────────────────────
orchestration: null   # the loop never dispatches into this repo.

# ── declared identities ──────────────────────────────────────────────────────
identities: null   # not cut over to App identities. Work runs as the maintainer, Seuss27.
                   # Revisit with the review gate (#88), now that the repo is in glunk-works.

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[project]
name = "resume-optimizer"
version = "0.1.0"
description = "A 'Resume-as-Code' pipeline using Gemini API, Jinja2, and Pandoc"
readme = "readme.md"
requires-python = ">=3.14"
authors = [{ name = "Jared Groves", email = "jgroves27@gmail.com" }]
keywords = ["resume", "automation", "llm", "gemini", "pandoc", "jinja2", "ats",]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "google-genai==2.34.0",
    "Jinja2==3.1.6",
    "pandas==3.1.1",
    "pypandoc==1.17",
    "keyring==25.7.0",
    "boto3==1.43.124",
    "docx2pdf==0.1.8",
    "pywin32==312; sys_platform == 'win32'",
    "pypdf==6.21.4",
    "platformdirs==4.14.5",
]

[project.urls]
Repository = "https://github.com/glunk-works/resume-orchestrator"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "pip-audit==2.10.1",
    "cyclonedx-bom==8.0.1",
    "zizmor==1.32.0",
]

# Define clean CLI entry points mapping directly to your functions
[project.scripts]
generate-resume = "resume_optimizer.generate:main"
build-resume-state = "resume_optimizer.build_state:main"

[tool.ruff]
# Target the minimum supported Python version
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E/F = pycodestyle/pyflakes, I = isort, B = bugbear, S = bandit
select = ["E", "F", "I", "B", "S"]

# Configure precise rule exclusions
ignore = [] # Keep this empty so production code is strictly checked

[tool.ruff.lint.per-file-ignores]
# Target your test suite specifically
"tests/*" = [
    "S101", # Allow assert statements for pytest
    "S105", # Allow dummy hardcoded password strings (e.g., "test-key")
    "S106", # Allow dummy hardcoded password strings in function arguments
]

[tool.ruff.format]
# Matches your prior Black settings
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
# A floor, not a pin: CI pins the uv binary exactly (UV_VERSION in .github/workflows/ci.yml).
required-version = ">=0.13.7"

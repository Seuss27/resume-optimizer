name: Ruleset drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruleset-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Read the rules that apply to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/rules.json"

      - name: Convert the project file to JSON
        run: |
          command -v yq >/dev/null || { echo "yq is missing from the runner image" >&2; exit 1; }
          yq -o=json . .ai/project.yml > "$RUNNER_TEMP/project.json"

      - name: Compare them
        run: python .github/scripts/check_ruleset.py "$RUNNER_TEMP/rules.json" "$RUNNER_TEMP/project.json"

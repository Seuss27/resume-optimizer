name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

env:
  # The one place CI's uv version is written. check_uv_pin.py compares it with the uv_build pin
  # in pyproject.toml, so a one-sided bump fails CI. A uv newer than the pinned setup-uv knows
  # may also need a setup-uv bump.
  UV_VERSION: "0.13.7"
  # No uv sync, uv run or uv export step may re-resolve uv.lock. It does not cover uv build,
  # uv venv or uv pip install.
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}

      - name: Check the uv pin
        run: uv run --no-project python .github/scripts/check_uv_pin.py pyproject.toml "$UV_VERSION" "$(uv --version)"

      - name: Install the locked project and dev dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}

      - name: Check the uv pin
        run: uv run --no-project python .github/scripts/check_uv_pin.py pyproject.toml "$UV_VERSION" "$(uv --version)"

      - name: Install the locked project and dev dependencies
        run: uv sync

      - name: Run test suite
        run: uv run pytest -q

      - name: Check tracked paths
        run: uv run python .github/scripts/check_tracked_paths.py

      - name: Wheel smoke test
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv venv --python 3.14 "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" "$RUNNER_TEMP"/wheel/*.whl
          mkdir "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          "$RUNNER_TEMP/smoke-venv/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py" "$RUNNER_TEMP"/wheel/*.whl

      - name: Upload the tested wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: ${{ runner.temp }}/wheel/*.whl
          if-no-files-found: error
          retention-days: 7

  # Advisory: dependencies may not publish 3.15 wheels yet, so this job may stay red.
  test-py315:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      UV_PYTHON: "3.15"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}

      - name: Check the uv pin
        run: uv run --no-project python .github/scripts/check_uv_pin.py pyproject.toml "$UV_VERSION" "$(uv --version)"

      - name: Install the locked project and dev dependencies
        run: uv sync

      - name: Check the interpreter is 3.15
        run: uv run python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 15) else 1)"

      - name: Run test suite
        run: uv run pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}

      - name: Check the uv pin
        run: uv run --no-project python .github/scripts/check_uv_pin.py pyproject.toml "$UV_VERSION" "$(uv --version)"

      - name: Install the locked project and dev dependencies
        run: uv sync

      - name: Export the locked requirements
        run: uv export --format requirements.txt --all-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt"

      - name: Audit the locked dependencies
        run: uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}

      - name: Check the uv pin
        run: uv run --no-project python .github/scripts/check_uv_pin.py pyproject.toml "$UV_VERSION" "$(uv --version)"

      - name: Install the locked project and dev dependencies
        run: uv sync

      - name: Generate the SBOM
        run: |
          uv run cyclonedx-py environment             --of JSON -o "$RUNNER_TEMP/sbom.cdx.json" .venv/bin/python

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}

      - name: Check the uv pin
        run: uv run --no-project python .github/scripts/check_uv_pin.py pyproject.toml "$UV_VERSION" "$(uv --version)"

      - name: Install the locked project and dev dependencies
        run: uv sync

      - name: Lint the workflows and the Dependabot config
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor .github

name: Secret scan

# Copy this file, unchanged, to <repo>/.github/workflows/secret-scan.yml. It calls the reusable
# workflow in 603-Identity/devcontainers that scans the full history of every pull request
# for committed secrets with the org's Betterleaks rules (devcontainers#190).
# See README.md in that repo (Secret scanning) and docs/threat_model.md.
#
# Rules that make the check mean something:
#   * The trigger is `pull_request` with NO `paths:` or `branches:` filter. This is a required
#     check, and a filtered required check that never reports blocks every other PR forever.
#   * The job id is `secrets` with no `name:` and no `if:`. The called workflow's job is `scan`,
#     so the check is literally `secrets / scan`: require exactly that name in the repo's
#     ruleset, pinned to integration_id 15368 (GitHub Actions).
#   * The pin is a full commit SHA plus a version comment, `@<sha> # vX.Y`. A bare tag fails
#     the called workflow's own SHA check, because job.workflow_ref would end in the tag.
#     Dependabot's github-actions ecosystem bumps it as a reviewed PR. The scanner version and
#     the org rules come from this pinned commit, so a pin bump is how they change.
#   * No `with:`, no `secrets:`, no write permission, no other job in this file, and no job key
#     besides `permissions:` and `uses:`.
#     `tools/check-consumer-workflows.sh` in that repo lints it.
#   * The scan reads this repo's `betterleaks.toml` and `.betterleaksignore` from the PR's BASE
#     commit, so a PR that adds its own false positive needs the ignore entry merged first.
on:
  pull_request:

permissions: {}

jobs:
  secrets:
    permissions:
      contents: read
    uses: 603-Identity/devcontainers/.github/workflows/secret-scan.yml@58d54dd63228e3640327bfcd34d91f64fcc88e60 # v1.6

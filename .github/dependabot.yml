version: 2
updates:
  # Monitor the pins in pyproject.toml and the locked set in uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # Monitor GitHub Actions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"

  # Monitor the hook revs in .pre-commit-config.yaml, so they keep pace with the pyproject.toml pins
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

name: Bug Report
description: Create a report to help us improve the system.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please ensure you have checked the existing open issues before submitting.
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Do not put any of the following in this report: resume or
        cover-letter text, job requisitions, company or employer names, contact details, file
        names from a run (they carry the company and role), or the contents of your `.env` file.

        The log file under `RO_LOG_DIR` is meant to carry only IDs, counts and scores. Tracebacks
        and warnings from third-party libraries can still quote content, so check every line
        before you paste it.
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: Provide a clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue? 
      placeholder: |
        1. Run command '...'
        2. Send payload '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Environment / Version
      description: What version of Python, uv, or the Docker image are you running?
      placeholder: e.g., Python 3.12.4, uv 0.1.39
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Tracebacks
      description: Paste the log lines here, and remove anything personal from them first.
      render: shell
    validations:
      required: false